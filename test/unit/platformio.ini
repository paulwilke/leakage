# PlatformIO configuration for unit tests

[env:native]
platform = native
test_framework = googletest
build_flags =
    -std=gnu++11
    -DUNIT_TEST
lib_deps =
    google/googletest@^1.14.0

[env:esp32]
platform = espressif32
board = nodemcu-32s
framework = espidf
test_framework = googletest
build_flags =
    -std=gnu++11
    -DUNIT_TEST
lib_deps =
    google/googletest@^1.14.0
