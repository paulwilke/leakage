# ============================================================================
# ESPHome mit CUSTOM DASHBOARD direkt auf ESP32
# Framework: ESP-IDF
# LÖSUNG: Nutzt web_server mit custom handler über includes
# ============================================================================

esphome:
  name: humidity01
  friendly_name: Humidity Sensor Dashboard

  # WICHTIG: Platformio-Optionen für Custom Web Files
  platformio_options:
    board_build.embed_files:
      - humidity_dashboard_embedded.html

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: "xxx"

ota:
  - platform: esphome
    password: "xxx"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Humidity Fallback"
    password: "fallback123"

captive_portal:

# ============================================================================
# Web Server
# Version 2 unterstützt ESP-IDF besser
# ============================================================================
web_server:
  port: 80
  version: 2
  # Das Standard-Interface ist weiterhin unter / verfügbar
  # Unser Custom Dashboard könnte unter /dashboard verfügbar sein

time:
  - platform: homeassistant
    id: esptime

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: sht4x
    temperature:
      name: "Temperatur"
    humidity:
      name: "Luftfeuchtigkeit"
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Adresse"
    ssid:
      name: "SSID"
    mac_address:
      name: "MAC Adresse"

# ============================================================================
# HINWEIS ZUR EMBEDDED-LÖSUNG:
#
# Das Einbetten von Custom HTML in ESP-IDF ist komplexer als mit Arduino.
# ESPHome's web_server component ist primär für das Standard-Interface.
#
# PRAKTIKABLERE LÖSUNGEN:
#
# 1. EINFACHSTE: Standard ESPHome Interface nutzen
#    - Funktioniert out-of-the-box mit ESP-IDF
#    - Öffne http://<esp32-ip>/
#    - Zeigt alle Sensoren übersichtlich an
#
# 2. BESTE FÜR CUSTOM DESIGN: Dashboard extern hosten
#    - Dashboard auf Raspberry Pi oder lokalem PC
#    - Greift auf ESP32 JSON API zu
#    - Kein Speicher auf ESP32 verbraucht
#    - Einfach zu aktualisieren
#
# 3. HYBRID: MDNS + Redirect
#    - Standard ESPHome Interface auf ESP32
#    - Custom Dashboard extern
#    - Beide über Namen erreichbar (humidity01.local)
#
# WARUM KEIN EMBEDDED MIT ESP-IDF?
# - ESPHome web_server component ist nicht für Custom HTML ausgelegt
# - SPIFFS/LittleFS Support in ESPHome ist Arduino-spezifisch
# - Würde Custom Component mit HTTP Server erfordern (kompliziert)
# - Standard-Interface ist bereits sehr gut!
#
# EMPFEHLUNG:
# Nutze das Standard ESPHome Interface - es ist mit ESP-IDF perfekt
# und zeigt alle Daten übersichtlich an!
#
# Oder hoste das Custom Dashboard extern für volle Kontrolle!
# ============================================================================
