<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leak Sensor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);color:#f1f5f9;min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto}
h1{font-size:24px;margin-bottom:20px;text-align:center;color:#60a5fa}
.card{background:#1e293b;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.3);border:1px solid #334155}
.leak-status{background:#334155;padding:30px;border-radius:12px;text-align:center;margin-bottom:20px;transition:all .3s}
.leak-status.dry{border:3px solid #10b981;background:rgba(16,185,129,0.1)}
.leak-status.wet{border:3px solid #ef4444;background:rgba(239,68,68,0.1);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
.leak-icon{font-size:64px;margin-bottom:15px}
.leak-icon.dry{color:#10b981}
.leak-icon.wet{color:#ef4444}
.leak-text{font-size:32px;font-weight:bold;margin-bottom:10px}
.leak-text.dry{color:#10b981}
.leak-text.wet{color:#ef4444}
.sensor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.sensor-item{background:#334155;padding:15px;border-radius:8px;text-align:center}
.sensor-value{font-size:28px;font-weight:bold;margin:10px 0;color:#60a5fa}
.sensor-label{font-size:14px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
.wifi{color:#10b981}
.status{display:inline-block;padding:5px 15px;border-radius:20px;font-size:12px;font-weight:bold;margin-top:10px}
.status.online{background:rgba(16,185,129,0.2);color:#10b981}
.status.offline{background:rgba(239,68,68,0.2);color:#ef4444}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #334155}
.info-row:last-child{border-bottom:none}
.info-label{color:#94a3b8;font-size:14px}
.info-value{color:#f1f5f9;font-weight:600}
.refresh-btn{background:#3b82f6;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;width:100%;transition:background .2s}
.refresh-btn:hover{background:#2563eb}
.refresh-btn:active{transform:scale(0.95)}
.update-time{text-align:center;color:#64748b;font-size:12px;margin-top:10px}
@media(max-width:600px){
h1{font-size:20px}
.leak-text{font-size:24px}
.leak-icon{font-size:48px}
}
</style>
</head>
<body>
<div class="container">
<h1>💧 Leak Sensor Dashboard</h1>

<div class="card">
<div class="leak-status" id="leakStatus">
<div class="leak-icon" id="leakIcon">💧</div>
<div class="leak-text" id="leakText">Prüfe Status...</div>
<div class="sensor-label" style="margin-top:10px">Wasserleck-Erkennung</div>
</div>
<div style="text-align:center">
<span class="status" id="status">Lädt...</span>
</div>
</div>

<div class="card">
<h2 style="font-size:18px;margin-bottom:15px;color:#60a5fa">📊 Sensor-Informationen</h2>
<div class="sensor-grid">
<div class="sensor-item">
<div class="sensor-label">WiFi Signal</div>
<div class="sensor-value wifi" id="wifi">-- dBm</div>
</div>
<div class="sensor-item">
<div class="sensor-label">Uptime</div>
<div class="sensor-value" id="uptime">--</div>
</div>
</div>
<div class="info-row">
<span class="info-label">IP-Adresse</span>
<span class="info-value" id="ip">--</span>
</div>
<div class="info-row">
<span class="info-label">MAC-Adresse</span>
<span class="info-value" id="mac">--</span>
</div>
<div class="info-row">
<span class="info-label">SSID</span>
<span class="info-value" id="ssid">--</span>
</div>
</div>

<div class="card">
<button class="refresh-btn" onclick="loadData()">🔄 Aktualisieren</button>
<div class="update-time">Letzte Aktualisierung: <span id="lastUpdate">--</span></div>
</div>
</div>

<script>
function loadData(){
fetch('/text_sensor').then(r=>r.json()).then(data=>{
document.getElementById('ip').textContent=data.find(s=>s.id.includes('ip'))?.value||'--';
document.getElementById('mac').textContent=data.find(s=>s.id.includes('mac'))?.value||'--';
document.getElementById('ssid').textContent=data.find(s=>s.id.includes('ssid'))?.value||'--';
}).catch(e=>console.error('Text sensor error:',e));

fetch('/binary_sensor').then(r=>r.json()).then(data=>{
let leak=data.find(s=>s.id.includes('wasserleck')||s.id.includes('leak'));
let leakStatus=document.getElementById('leakStatus');
let leakIcon=document.getElementById('leakIcon');
let leakText=document.getElementById('leakText');

if(leak){
if(leak.value){
leakStatus.className='leak-status wet';
leakIcon.className='leak-icon wet';
leakIcon.textContent='⚠️';
leakText.className='leak-text wet';
leakText.textContent='WASSERLECK ERKANNT!';
}else{
leakStatus.className='leak-status dry';
leakIcon.className='leak-icon dry';
leakIcon.textContent='✓';
leakText.className='leak-text dry';
leakText.textContent='Trocken - Alles OK';
}
}
}).catch(e=>console.error('Binary sensor error:',e));

fetch('/sensor').then(r=>r.json()).then(data=>{
let wifi=data.find(s=>s.id.includes('wifi'));
let uptime=data.find(s=>s.id.includes('uptime'));

if(wifi)document.getElementById('wifi').textContent=wifi.value.toFixed(0)+' dBm';
if(uptime){
let s=uptime.value;
let d=Math.floor(s/86400);
let h=Math.floor((s%86400)/3600);
let m=Math.floor((s%3600)/60);
document.getElementById('uptime').textContent=d>0?d+'d '+h+'h':h>0?h+'h '+m+'m':m+'m';
}

document.getElementById('status').textContent='Online';
document.getElementById('status').className='status online';
document.getElementById('lastUpdate').textContent=new Date().toLocaleTimeString('de-DE');
}).catch(e=>{
console.error('Sensor error:',e);
document.getElementById('status').textContent='Offline';
document.getElementById('status').className='status offline';
});
}

loadData();
setInterval(loadData,5000);
</script>
</body>
</html>
