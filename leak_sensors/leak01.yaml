# ============================================================================
# ESPHome Konfiguration für Wasserleck-Sensor (Shelly Leak Sensor Cable)
# Hardware: ESP32 mit einfachem Leak Detection Cable
# Verwendung: Wasserleck-Erkennung mit Kabel-Sensor
# Webserver: Direkt vom ESP32 ausgeliefert (ESP-IDF)
# ============================================================================

esphome:
  name: leak01
  friendly_name: Leak Sensor 01
  # Custom Components für ESP-IDF Webserver mit Config-UI
  includes:
    - custom_components/config_storage.h
    - custom_components/idf_webserver.h
  on_boot:
    priority: -100  # Nach allen anderen Components
    then:
      - lambda: |-
          static IDFWebServer* web_server = new IDFWebServer();
          web_server->setup();

# ============================================================================
# ESP32 Konfiguration
# ESP-IDF Framework für nativen Webserver Support
# ============================================================================
esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf
    version: recommended

# ============================================================================
# Preferences (für NVS Storage)
# ============================================================================
preferences:
  flash_write_interval: 1min

# ============================================================================
# Logging
# ============================================================================
logger:
  # level: DEBUG

# ============================================================================
# Home Assistant API
# ============================================================================
api:
  encryption:
    key: !secret api_key  # API Verschlüsselungsschlüssel - sollte eindeutig sein

# ============================================================================
# OTA Updates (Over-The-Air)
# ============================================================================
ota:
  - platform: esphome
    password: !secret ota_password  # OTA Update Passwort

# ============================================================================
# Safe Mode
# Aktiviert automatischen Rollback bei fehlgeschlagenen Updates
# ============================================================================
safe_mode:
  reboot_timeout: 5min    # Timeout für Safe Mode Aktivierung
  num_attempts: 3         # Anzahl Boot-Versuche vor Safe Mode

# ============================================================================
# WiFi Konfiguration mit statischer IP
# ============================================================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Statische IP-Konfiguration
  manual_ip:
    static_ip: 10.10.50.91
    gateway: 10.10.50.1
    subnet: 255.255.255.0

  # Fallback Access Point bei WiFi-Problemen
  ap:
    ssid: "Leak Sensor 01 Fallback"
    password: "fallback123"

# ============================================================================
# Captive Portal
# ============================================================================
captive_portal:

# HINWEIS: Kein ESPHome web_server - wir nutzen die Custom IDF Component!

# ============================================================================
# Zeitsynchronisation
# ============================================================================
time:
  - platform: homeassistant
    id: esptime

# ============================================================================
# Binärsensoren
# ============================================================================
binary_sensor:
  # --------------------------------------------------------------------------
  # Wasserleck-Sensor (wie in original.yaml - FUNKTIONIERT!)
  #
  # ANSCHLUSS:
  # -----------
  # ESP32 Pin     |  Leak Sensor Cable
  # --------------|-------------------
  # GND           |  Draht 1 (schwarz)
  # GPIO4         |  Draht 2 (rot)
  #
  # WICHTIG: inverted: true bedeutet:
  # - Trocken (Kontakt offen): Pin HIGH -> Sensor meldet FALSE (kein Leck)
  # - Nass (Kontakt geschlossen): Pin LOW -> Sensor meldet TRUE (Leck!)
  # --------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true          # WICHTIG: true für korrekte Leck-Erkennung!
    
    name: "Wasserleck erkannt"
    id: water_leak
    device_class: moisture
    
    # Filter um Fehlalarme zu vermeiden
    filters:
      - delayed_on: 100ms
      - delayed_off: 5s
    
    # Aktion bei Leck-Erkennung
    on_press:
      then:
        - logger.log: "ALARM! Wasserleck erkannt!"
    
    # Aktion wenn Sensor wieder trocken
    on_release:
      then:
        - logger.log: "Wasserleck behoben - Sensor wieder trocken"

  # --------------------------------------------------------------------------
  # Status-Sensor: Zeigt an ob der ESP mit Home Assistant verbunden ist
  # --------------------------------------------------------------------------
  - platform: status
    name: "Status"
    id: device_status_sensor

# ============================================================================
# Sensoren für Diagnose (optional)
# ============================================================================
sensor:
  # WiFi Signal Stärke
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 60s

  # Uptime
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s

# ============================================================================
# Text-Sensoren (optional)
# ============================================================================
text_sensor:
  # WiFi-Informationen
  - platform: wifi_info
    ip_address:
      name: "IP Adresse"
      id: ip_address
    ssid:
      name: "SSID"
      id: ssid
    mac_address:
      name: "MAC Adresse"
      id: mac_address

# ============================================================================
# ANLEITUNG:
#
# 1. HARDWARE-AUFBAU:
#    - Verbinde den ersten Draht des Leak Sensor Cables mit GND am ESP32
#    - Verbinde den zweiten Draht mit GPIO4 am ESP32
#    - Keine weiteren Komponenten nötig! Der ESP32 nutzt den internen Pullup
#
# 2. FUNKTIONSWEISE:
#    - Im trockenen Zustand: Kontakt offen -> Pin HIGH (durch Pullup)
#    - Bei Nässe: Kontakt geschlossen -> Pin LOW
#    - Home Assistant zeigt: "Clear" (trocken) oder "Wet" (nass)
#
# 3. ALTERNATIVE PINS:
#    Wenn GPIO4 bereits belegt ist, kannst du jeden anderen GPIO nutzen:
#    ESP32: GPIO2, GPIO4, GPIO5, GPIO12-19, GPIO21-23, GPIO25-27, GPIO32-39
#    ESP8266: GPIO4 (D2), GPIO5 (D1), GPIO12 (D6), GPIO13 (D7), GPIO14 (D5)
#
#    NICHT nutzen: GPIO0, GPIO2, GPIO15 (Boot-Pins)
#
# 4. TESTEN:
#    - Schau ins ESPHome Log: esphome logs leak01.yaml
#    - Verbinde die beiden Drähte des Sensors manuell -> sollte "ALARM!" loggen
#    - Trenne die Drähte -> sollte "Sensor wieder trocken" loggen
#
# 5. SECRETS-DATEI:
#    Erstelle eine secrets.yaml im gleichen Verzeichnis:
#    wifi_ssid: "DeinWiFiName"
#    wifi_password: "DeinWiFiPasswort"
#
# 6. FLASHEN:
#    Erstes Mal per USB:     esphome run leak01.yaml
#    Spätere Updates (OTA):  esphome run leak01.yaml
#
# ============================================================================
