esphome:
  name: humidity01
  friendly_name: Humidity Sensor
  # Custom Component einbinden
  includes:
    - custom_components/idf_webserver.h
  on_boot:
    priority: -100  # Nach allen anderen Components
    then:
      - lambda: |-
          static IDFWebServer* web_server = new IDFWebServer();
          web_server->setup();

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf
    version: recommended
    # ESP-IDF specific settings
    sdkconfig_options:
      CONFIG_HTTPD_MAX_REQ_HDR_LEN: "1024"
      CONFIG_HTTPD_MAX_URI_LEN: "512"

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key  # API Verschlüsselungsschlüssel - sollte eindeutig sein

# ============================================================================
# OTA Updates (Over-The-Air)
# ============================================================================
ota:
  - platform: esphome
    password: !secret ota_password  # OTA Update Passwort

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 10.10.50.91
    gateway: 10.10.50.1
    subnet: 255.255.255.0
  ap:
    ssid: "Humidity 1 Fallback Hotspot"
    password: "bvJU6UGN6jIc"

time:
  - platform: homeassistant
    id: esptime

# Globale Variablen für Web-API Zugriff
globals:
  - id: leak_detected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: device_status
    type: bool
    restore_value: no
    initial_value: 'true'

binary_sensor:
  # Wasserleck-Sensor
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Wasserleck erkannt"
    id: water_leak
    device_class: moisture
    filters:
      - delayed_on: 100ms
      - delayed_off: 5s
    on_press:
      then:
        - logger.log: "ALARM! Wasserleck erkannt!"
        - globals.set:
            id: leak_detected
            value: 'true'
    on_release:
      then:
        - logger.log: "Wasserleck behoben - Sensor wieder trocken"
        - globals.set:
            id: leak_detected
            value: 'false'

  # Status-Sensor
  - platform: status
    name: "Status"
    id: device_status_sensor
    on_press:
      then:
        - globals.set:
            id: device_status
            value: 'true'
    on_release:
      then:
        - globals.set:
            id: device_status
            value: 'false'